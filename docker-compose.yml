services:
  mysql:
    image: mysql:8.0
    container_name: fyp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: fyp_selection
      MYSQL_USER: fyp
      MYSQL_PASSWORD: fyp_pass
    ports:
      - "3306:3306"
    volumes:
      - fyp_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufyp", "-pfyp_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fyp_mysql_data:
